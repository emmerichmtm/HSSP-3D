[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hssp3d"
version = "0.2.0"
description = "3-D hypervolume subset selection: the n^O(sqrt k) separator dynamic programme and the EPTAS of Bringmann, Cabello and Emmerich (Python + Numba)"
readme = "README.md"
authors = [{ name = "Michael Emmerich" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "numba>=0.57"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
